<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.25)" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .gradient-title {
        fill: url(#glowGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }

      /* Dynamic Wave / Floating Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1) translateY(0px); }
        50% { opacity: 0.65; transform: scale(1.08) translateY(-6px); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(15px, -12px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-18px, 14px); }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite, floatSlow 10s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite 2s, floatReverse 12s ease-in-out infinite;
        transform-origin: center;
      }
      .stream-line {
        stroke-dasharray: 12 12;
        animation: streamFlow 4s linear infinite;
      }
      .stream-line-slow {
        stroke-dasharray: 8 16;
        animation: streamFlow 7s linear infinite reverse;
      }
    </style>
  </defs>

  <!-- Deep Sci-Fi Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Safe Behind Foreground Content) -->
  <g opacity="0.6">
    <!-- Ambient glowing nodes -->
    <circle class="floating-orb-1" cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
    <circle class="floating-orb-2" cx="1060" cy="180" r="160" fill="#a855f7" opacity="0.18" filter="url(#glow)" />
    <circle class="floating-orb-1" cx="800" cy="30" r="110" fill="#6366f1" opacity="0.14" filter="url(#glow)" />

    <!-- Animated Data Flow / Topology Streams (Far Background) -->
    <path class="stream-line" d="M -50 70 Q 300 20 600 90 T 1250 50" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.35" />
    <path class="stream-line-slow" d="M -50 290 Q 350 330 750 260 T 1250 310" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.3" />
    <path class="stream-line" d="M 150 350 Q 500 180 900 290 T 1250 160" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.25" />
  </g>

  <!-- FOREGROUND CONTENT: CLEAR, READABLE, GUARANTEED UNBLOCKED -->
  <g transform="translate(80, 55)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="19" class="pill-text" fill="#38bdf8">DISTRIBUTED AI INFRA</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" class="title-text">
      Awesome <tspan class="gradient-title">LLM Training</tspan> Frameworks
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" class="subtitle-text">
      The curated index of distributed pre-training, fine-tuning pipelines &amp; GPU cloud platforms
    </text>

    <!-- Dynamic Architectural Feature Pills (Clean Foreground Row) -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: 3D Parallelism -->
      <g transform="translate(0, 0)">
        <rect width="180" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
        <circle cx="20" cy="20" r="5" fill="#38bdf8" />
        <text x="34" y="25" class="pill-text">⚡ 3D &amp; ZeRO Parallelism</text>
      </g>

      <!-- Pill 2: Distributed Pre-Training -->
      <g transform="translate(196, 0)">
        <rect width="200" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.2" />
        <circle cx="20" cy="20" r="5" fill="#818cf8" />
        <text x="34" y="25" class="pill-text">🔥 Distributed Pre-Training</text>
      </g>

      <!-- Pill 3: Alignment & RLHF -->
      <g transform="translate(412, 0)">
        <rect width="186" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2" />
        <circle cx="20" cy="20" r="5" fill="#c084fc" />
        <text x="34" y="25" class="pill-text">🎯 RLHF &amp; GRPO Alignment</text>
      </g>

      <!-- Pill 4: GPU Neoclouds -->
      <g transform="translate(614, 0)">
        <rect width="180" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.2" />
        <circle cx="20" cy="20" r="5" fill="#34d399" />
        <text x="34" y="25" class="pill-text">☁️ GPU Neocloud Clusters</text>
      </g>
    </g>
  </g>
</svg>
